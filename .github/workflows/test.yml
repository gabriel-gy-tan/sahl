name: Test

# Sidecar pytest suite and the extension's node tests on every pull request and on main.
# macOS because that is where the dependencies (indra-ocr, pynput, mss) are known to install, as in release.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecar tests
        working-directory: sidecar
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pytest -q
      - name: Extension tests
        run: node --test extension/background.test.mjs
