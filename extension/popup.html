  <!-- text is filled from i18n.json in the panel's language (data-t keys); the English here shows only if that fails -->
  <header>
    <span class="mark" aria-hidden="true"><img src="palm.png" alt=""></span>
    <div class="brand">
      <h1>Sahl</h1>
      <p id="status" role="status" data-t="checking">Looking for Sahl…</p>
    </div>
  </header>
  <div class="scanline" aria-hidden="true"></div>

  <main>
    <section id="pair" class="hero" hidden>
      <span class="tile accent" aria-hidden="true"><svg class="i"><use href="#i-plugs-connected"/></svg></span>
      <p class="lead" data-t="pair_lead">Pair this browser once with Sahl on this computer.</p>
      <form id="pair-form">
        <label for="code" data-t="pair_code">Pairing code</label>
        <!-- one real input for typing, pasting and screen readers; the six cells under it only draw what it holds -->
        <div class="code">
          <div class="cells" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <input id="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </div>
        <button class="primary wide" type="submit" data-t="pair">Pair</button>
      </form>
      <p class="fine" data-t="pair_hint">Open Sahl, then Settings → Browser extension to see the code.</p>
    </section>

    <section id="work" hidden>
      <div id="guide" class="guide"></div>
      <label id="person-row" class="setting" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-user-circle"/></svg>
        <span data-t="person_for">This form is for</span>
        <span class="pick">
          <select id="person"></select>
          <svg class="i" aria-hidden="true"><use href="#i-caret-down"/></svg>
        </span>
      </label>
      <ul id="fields" data-t-label="fields_label" aria-label="Boxes I found on this page"></ul>
      <label class="setting replace">
        <span data-t="replace">Replace values already in the boxes</span>
        <input id="replace" type="checkbox" class="switch">
      </label>
    </section>

    <section id="none" class="hero" hidden>
      <span class="tile" aria-hidden="true"><svg class="i"><use href="#i-warning-circle"/></svg></span>
      <p class="lead" id="none-text"></p>
      <button id="retry" class="secondary" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-arrow-clockwise"/></svg>
        <span data-t="retry">Try again</span>
      </button>
    </section>
  </main>

  <!-- the dock stays at the bottom while the list scrolls, so the note and the fill button are never cut off -->
  <footer>
    <div id="dock" class="dock" hidden>
      <p id="note" class="note" role="status"></p>
      <div class="actions">
        <button id="clear" class="icon" type="button" data-t-label="hide_marks" aria-label="Hide marks" title="Hide marks">
          <svg class="i" aria-hidden="true"><use href="#i-eye-slash"/></svg>
        </button>
        <button id="rescan" class="icon" type="button" data-t-label="read_again" aria-label="Read again" title="Read again">
          <svg class="i" aria-hidden="true"><use href="#i-arrow-clockwise"/></svg>
        </button>
        <button id="fill" class="primary" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-sparkle"/></svg>
          <span data-t="fill">Fill selected</span><span id="count" class="count"></span>
        </button>
      </div>
    </div>
    <p class="promise">
      <svg class="i" aria-hidden="true"><use href="#i-shield-check"/></svg>
      <span data-t="footer">I never log in, pay, submit or tick a box for you.</span>
    </p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
