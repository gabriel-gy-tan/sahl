<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahl</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- text is filled from i18n.json in the panel's language (data-t keys); the English here shows only if that fails -->
  <header>
    <span class="mark" aria-hidden><img src="palm.png" alt=""></span>
    <h1>Sahl</h1>
    <p id="status" role="status" data-t="checking">Looking for Sahl…</p>
  </header>
  <div class="scanline" aria-hidden></div>

  <main>
    <section id="pair" hidden>
      <p class="lead" data-t="pair_lead">Pair this browser once with Sahl on this computer.</p>
      <form id="pair-form">
        <label for="code" data-t="pair_code">Pairing code</label>
        <div class="pair-row">
          <input id="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
          <button class="primary" type="submit" data-t="pair">Pair</button>
        </div>
      </form>
      <p class="fine" data-t="pair_hint">Open Sahl, then Settings → Browser extension to see the code.</p>
    </section>

    <section id="work" hidden>
      <div id="guide" class="guide"></div>
      <label id="person-row" class="person" hidden>
        <span data-t="person_for">This form is for</span>
        <select id="person"></select>
      </label>
      <ul id="fields" data-t-label="fields_label" aria-label="Boxes I found on this page"></ul>
      <label class="replace"><input id="replace" type="checkbox"> <span data-t="replace">Replace values already in the boxes</span></label>
    </section>

    <section id="none" hidden>
      <p class="lead" id="none-text"></p>
      <button id="retry" class="primary" type="button" data-t="retry">Try again</button>
    </section>
  </main>

  <!-- the dock stays at the bottom while the list scrolls, so the note and the fill button are never cut off -->
  <footer>
    <div id="dock" class="dock" hidden>
      <p id="note" class="note" role="status"></p>
      <div class="actions">
        <button id="clear" class="quiet" type="button" data-t="hide_marks">Hide marks</button>
        <button id="rescan" class="quiet" type="button" data-t="read_again">Read again</button>
        <button id="fill" class="primary" type="button"><span data-t="fill">Fill selected</span><span id="count" class="count"></span></button>
      </div>
    </div>
    <p class="promise" data-t="footer">I never log in, pay, submit or tick a box for you.</p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
